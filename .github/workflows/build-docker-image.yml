name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 强制使用 Node.js 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # 升级到 v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4    # 升级到 v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6   # 升级到 v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/laowangok:2026
          build-args: |
            NODE_ENV=production

      - name: Image Info
        run: docker image inspect ghcr.io/${{ github.repository_owner }}/laowangok:2026
